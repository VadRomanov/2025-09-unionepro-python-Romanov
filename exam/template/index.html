<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планировщик путешествий</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Планировщик путешествий</h1>
            <div style="position: absolute; top: 20px; right: 20px;">
                <span id="username" style="color: white; margin-right: 15px;"></span>
                <button onclick="logout()" class="btn" style="background: rgba(255, 255, 255, 0.2); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer;">Выйти</button>
            </div>
        </header>
        
        <main class="main-content">
            <div class="action-cards">
                <a href="create.html" class="action-card">
                    <div class="card-icon">✈️</div>
                    <h2>Создать новое путешествие</h2>
                    <p>Начните планировать новую поездку</p>
                </a>
            </div>
            
            <div class="trips-list" id="tripsList">
                <h2 id="tripsHeader">Ваши путешествия</h2>
                <div id="tripsContainer">
                    <p class="no-trips">Путешествий пока нет. Создайте первое!</p>
                </div>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
