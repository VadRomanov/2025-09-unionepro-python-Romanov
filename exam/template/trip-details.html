<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Описание путешествия</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="tripTitle">Описание путешествия</h1>
            <a href="index.html" class="back-link">← Назад</a>
            <a href="#" id="editBtn" class="edit-link">✏️ Редактировать</a>
        </header>
        
        <main class="main-content">
            <div id="tripDetails" class="trip-details">
                <div class="trip-header">
                    <div class="trip-dates" id="tripDates"></div>
                    <div class="trip-locations" id="tripLocations"></div>
                </div>

                <section class="details-section">
                    <h2>Билеты</h2>
                    <div id="ticketsSection" class="details-list">
                        <p class="no-items">Билеты не добавлены</p>
                    </div>
                </section>

                <section class="details-section">
                    <h2>Размещение</h2>
                    <div id="accommodationsSection" class="details-list">
                        <p class="no-items">Размещение не добавлено</p>
                    </div>
                </section>

                <section class="details-section">
                    <h2>Заметки</h2>
                    <div id="notesSection" class="details-list">
                        <p class="no-items">Заметки не добавлены</p>
                    </div>
                </section>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
    <script>
        // Получить ID поездки из URL
        const urlParams = new URLSearchParams(window.location.search);
        const tripId = urlParams.get('id');
        
        if (!tripId) {
            alert('Не указан ID путешествия!');
            window.location.href = 'index.html';
        } else {
            // Установить ссылку на редактирование
            document.getElementById('editBtn').href = `edit.html?id=${tripId}`;
            
            // Загрузить и отобразить данные поездки
            (async () => {
                const trip = await getTripById(tripId);
                
                if (!trip) {
                    alert('Путешествие не найдено!');
                    window.location.href = 'index.html';
                    return;
                }
                
                // Заголовок
                document.getElementById('tripTitle').textContent = trip.name || 'Описание путешествия';
                
                // Даты
                const datesDiv = document.getElementById('tripDates');
                if (trip.departureDate || trip.arrivalDate) {
                    datesDiv.innerHTML = `
                        <span>📅 ${formatDate(trip.departureDate)} - ${formatDate(trip.arrivalDate)}</span>
                    `;
                } else {
                    datesDiv.innerHTML = '<span>📅 Даты не указаны</span>';
                }
                
                // Места отправления и прибытия
                const locationsDiv = document.getElementById('tripLocations');
                const departure = trip.departureLocation || 'Не указано';
                const arrival = trip.arrivalLocation || 'Не указано';
                locationsDiv.innerHTML = `<span>📍 ${departure} → ${arrival}</span>`;
                
                // Билеты
                const ticketsSection = document.getElementById('ticketsSection');
                if (trip.tickets && trip.tickets.length > 0) {
                    ticketsSection.innerHTML = '';
                    trip.tickets.forEach((ticket, index) => {
                        const ticketDiv = document.createElement('div');
                        ticketDiv.className = 'detail-item';
                        ticketDiv.innerHTML = `
                            <div class="detail-item-header">
                                <h3>Билет ${index + 1}</h3>
                            </div>
                            <div class="detail-item-content">
                                <p><strong>Тип транспорта:</strong> ${ticket.type || 'Не указано'}</p>
                                <p><strong>Отправление:</strong> ${ticket.departure || 'Не указано'}</p>
                                <p><strong>Прибытие:</strong> ${ticket.arrival || 'Не указано'}</p>
                                ${ticket.departureDate ? `<p><strong>Дата отправления:</strong> ${formatDate(ticket.departureDate)}</p>` : ''}
                                ${ticket.arrivalDate ? `<p><strong>Дата прибытия:</strong> ${formatDate(ticket.arrivalDate)}</p>` : ''}
                                ${ticket.file ? `<p><strong>Файл:</strong> ${ticket.file}</p>` : ''}
                            </div>
                        `;
                        ticketsSection.appendChild(ticketDiv);
                    });
                } else {
                    ticketsSection.innerHTML = '<p class="no-items">Билеты не добавлены</p>';
                }
                
                // Размещение
                const accommodationsSection = document.getElementById('accommodationsSection');
                if (trip.accommodations && trip.accommodations.length > 0) {
                    accommodationsSection.innerHTML = '';
                    trip.accommodations.forEach((accommodation, index) => {
                        const accommodationDiv = document.createElement('div');
                        accommodationDiv.className = 'detail-item';
                        accommodationDiv.innerHTML = `
                            <div class="detail-item-header">
                                <h3>${accommodation.name || `Размещение ${index + 1}`}</h3>
                            </div>
                            <div class="detail-item-content">
                                ${accommodation.type ? `<p><strong>Тип:</strong> ${accommodation.type}</p>` : ''}
                                ${accommodation.checkin ? `<p><strong>Дата заселения:</strong> ${formatDate(accommodation.checkin)}</p>` : ''}
                                ${accommodation.checkout ? `<p><strong>Дата выезда:</strong> ${formatDate(accommodation.checkout)}</p>` : ''}
                                ${accommodation.address ? `<p><strong>Адрес:</strong> ${accommodation.address}</p>` : ''}
                                ${accommodation.file ? `<p><strong>Файл:</strong> ${accommodation.file}</p>` : ''}
                            </div>
                        `;
                        accommodationsSection.appendChild(accommodationDiv);
                    });
                } else {
                    accommodationsSection.innerHTML = '<p class="no-items">Размещение не добавлено</p>';
                }
                
                // Заметки
                const notesSection = document.getElementById('notesSection');
                if (trip.notes && trip.notes.length > 0) {
                    notesSection.innerHTML = '';
                    trip.notes.forEach((note, index) => {
                        const noteDiv = document.createElement('div');
                        noteDiv.className = 'detail-item';
                        noteDiv.innerHTML = `
                            <div class="detail-item-header">
                                <h3>${note.title || `Заметка ${index + 1}`}</h3>
                            </div>
                            <div class="detail-item-content">
                                <p>${note.content || ''}</p>
                            </div>
                        `;
                        notesSection.appendChild(noteDiv);
                    });
                } else {
                    notesSection.innerHTML = '<p class="no-items">Заметки не добавлены</p>';
                }
            })();
        }
    </script>
</body>
</html>
