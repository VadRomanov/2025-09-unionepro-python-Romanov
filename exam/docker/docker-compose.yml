version: '3.9'
name: plan-your-trip

services:
  plan-your-trip-db:
    image: 'postgres:14-alpine'
    container_name: plan-your-trip-db
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plan_your_trip

  plan-your-trip-minio:
    image: minio/minio:RELEASE.2022-03-03T21-21-16Z
    container_name: plan-your-trip-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: localhost,plan-your-trip-minio
    command: server /data --console-address ":9001"
    networks:
      default:
        aliases:
          - plan-your-trip-file-bucket.plan-your-trip-minio
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9001" ]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s

  plan-your-trip-minio-create-buckets:
    image: minio/mc:RELEASE.2022-03-03T21-12-24Z
    container_name: plan-your-trip-miniomc
    depends_on:
      plan-your-trip-minio:
        condition: service_healthy
    volumes:
      - ../volumes/minio/policy:/var/policy
    entrypoint: >
      /bin/sh -c "          
      /usr/bin/mc alias set plan-your-trip-minio http://plan-your-trip-minio:9000 root password;
      
      /usr/bin/mc mb plan-your-trip-minio/plan-your-trip-file-bucket;
      /usr/bin/mc anonymous set public plan-your-trip-minio/plan-your-trip-file-bucket;

      /usr/bin/mc admin policy add plan-your-trip-minio cp-user-policy /var/policy/plan-your-trip-user-policy.json;
      /usr/bin/mc admin user add plan-your-trip-minio Root-User Root-Password;          
      /usr/bin/mc admin policy set plan-your-trip-minio cp-user-policy user=Root-User;
      
      exit 0;
      "